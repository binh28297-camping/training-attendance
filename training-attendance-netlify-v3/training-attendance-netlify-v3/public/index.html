<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Check-in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;display:flex;align-items:center;justify-content:center}
.card{width:min(94vw,460px);background:#fff;border-radius:24px;padding:30px;box-shadow:0 16px 45px rgba(0,0,0,.10)}
h1{margin:0 0 6px;text-align:center}.session{text-align:center;color:#667085;margin-bottom:25px;font-size:14px}
label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:18px;outline:none}input:focus{border-color:#2563eb}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:17px;cursor:pointer}button:disabled{opacity:.6}
.msg{display:none;margin-top:18px;padding:15px;border-radius:12px;white-space:pre-line;line-height:1.5}.ok{display:block;background:#ecfdf3;color:#067647}.err{display:block;background:#fef3f2;color:#b42318}.info{display:block;background:#eff8ff;color:#175cd3}
.hidden{display:none}.hint{font-size:12px;color:#667085;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Training Check-in</h1>
  <div id="sessionLabel" class="session">Loading session...</div>

  <div id="firstTimeFields">
    <label for="name">Full name</label>
    <input id="name" type="text" autocomplete="name" placeholder="Enter your full name">
  </div>

  <label for="code">8-digit attendance code</label>
  <input id="code" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="00000000">

  <button id="checkBtn" onclick="checkIn()">CHECK IN</button>
  <div id="msg" class="msg"></div>
  <div class="hint">Your code is your personal attendance ID after first registration.</div>
</div>

<script>
let session = null;
let registered = false;

function show(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

async function loadSession() {
  try {
    const res = await fetch('/.netlify/functions/checkin?action=session');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unable to load session.');
    session = data;
    document.getElementById('sessionLabel').textContent = data.name + ' • ' + data.id;
  } catch (e) {
    show(e.message, 'err');
    document.getElementById('checkBtn').disabled = true;
  }
}

async function checkCode() {
  const code = document.getElementById('code').value.trim();
  if (!/^\d{8}$/.test(code)) {
    registered = false;
    document.getElementById('firstTimeFields').classList.remove('hidden');
    return;
  }
  try {
    const res = await fetch('/.netlify/functions/checkin?action=lookup&code=' + encodeURIComponent(code));
    const data = await res.json();
    if (res.ok && data.registered) {
      registered = true;
      document.getElementById('firstTimeFields').classList.add('hidden');
      show('Code recognized. Welcome back, ' + data.name + '!', 'info');
    } else {
      registered = false;
      document.getElementById('firstTimeFields').classList.remove('hidden');
      document.getElementById('msg').className = 'msg';
    }
  } catch {}
}

async function checkIn() {
  if (!session) return;
  const code = document.getElementById('code').value.trim();
  const name = document.getElementById('name').value.trim();
  const btn = document.getElementById('checkBtn');

  if (!/^\d{8}$/.test(code)) return show('Please enter your 8-digit code.', 'err');
  if (!registered && !name) return show('Please enter your full name for first registration.', 'err');

  btn.disabled = true;
  btn.textContent = 'CHECKING...';
  show('Checking your attendance...', 'info');

  try {
    const res = await fetch('/.netlify/functions/checkin', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sessionId: session.id, code, name})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Check-in failed.');

    show('✓ Attendance recorded successfully!\n' + data.name + '\n' + data.time, 'ok');
    document.getElementById('name').value = '';
    document.getElementById('code').value = '';
    document.getElementById('firstTimeFields').classList.remove('hidden');
    registered = false;
  } catch (e) {
    show(e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'CHECK IN';
  }
}

document.getElementById('code').addEventListener('input', () => {
  if (document.getElementById('code').value.length === 8) checkCode();
});
document.getElementById('code').addEventListener('keydown', e => { if(e.key === 'Enter') checkIn(); });
document.getElementById('name').addEventListener('keydown', e => { if(e.key === 'Enter') checkIn(); });
loadSession();
</script>
</body>
</html>
